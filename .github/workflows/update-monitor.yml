name: Update Central Bank Monitor

on:
  schedule:
    # Every day at 14:15 UTC = 10:15 a.m. New York time in summer (9:15 a.m. in winter),
    # after the 8:30 a.m. government data releases.
    - cron: "15 14 * * *"
    # Wednesdays a second run at 19:30 UTC to catch 2:00 p.m. Fed decisions.
    - cron: "30 19 * * 3"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual updates

permissions:
  contents: write

concurrency:
  group: monitor-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # Node 20 reached end-of-life in April 2026
      - name: Collect data and rewrite explanations
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Optional alternative to Gemini:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: node scripts/update.mjs
      - name: Publish (commit the new data; Netlify redeploys automatically)
        run: |
          git config user.name "macro-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/monitor/data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git pull --rebase   # in case you pushed site changes while this ran
          git push
